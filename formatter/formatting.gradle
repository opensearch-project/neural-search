allprojects {
    project.apply plugin: "com.diffplug.spotless"

    // The native build tree, the vendored nsparse submodule and the dependencies its
    // CMake fetches (googletest, abseil) are not ours to format. They also collide
    // with buildJniLib, which declares jni/build as a task output: spotless reading
    // that directory without declaring the dependency fails Gradle's validation.
    def nativeExcludes = ['jni/build/**', 'jni/third_party/**', 'jni/external/**']

    spotless {
        java {
            // Normally this isn't necessary, but we have Java sources in
            // non-standard places
            target '**/*.java'
            targetExclude nativeExcludes

            removeUnusedImports()
            eclipse().withP2Mirrors(Map.of("https://download.eclipse.org/", "https://ci.opensearch.org/")).configFile rootProject.file('formatter/formatterConfig.xml')
            trimTrailingWhitespace()
            endWithNewline();

            custom 'Refuse wildcard imports', {
                // Wildcard imports can't be resolved; fail the build
                if (it =~ /\s+import .*\*;/) {
                    throw new AssertionError("Do not use wildcard imports.  'spotlessApply' cannot resolve this issue.")
                }
            }
        }
        format 'misc', {
            target '*.md', '**/*.gradle', '**/*.json', '**/*.yaml', '**/*.yml', '**/*.svg', '**/*.properties'
            targetExclude nativeExcludes

            trimTrailingWhitespace()
            endWithNewline()
        }
        format("license", {
            licenseHeaderFile("${rootProject.file("formatter/license-header.txt")}", "package ");
            target("src/*/java/**/*.java","qa/*/java/**/*.java")
        })
    }
}
